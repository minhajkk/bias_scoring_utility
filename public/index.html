<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bias Score Tool</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 2rem; max-width: 600px; margin: auto; }
    textarea { width: 100%; height: 150px; margin-bottom: 10px; padding: 10px; font-size: 16px; }
    select, button { padding: 10px; font-size: 16px; margin-bottom: 10px; }
    .result { background: #f8f8f8; padding: 10px; border-left: 5px solid #ccc; margin-top: 20px; }
    pre { white-space: pre-wrap; word-wrap: break-word; }
  </style>
</head>
<body>
  <h1>Bias Score Checker</h1>
  <textarea id="inputText" placeholder="Enter prompt or LLM response..."></textarea><br>

  <label>Type:</label>
  <select id="contextType">
    <option value="Prompt">Prompt</option>
    <option value="Response">Response</option>
  </select><br>

  <label>Model:</label>
  <select id="modelType">
    <option value="zeroShot">Zero-Shot (Bias Categories)</option>
    <option value="hateSpeech">Hate Speech Detection</option>
  </select><br>

  <button id="submitBtn" onclick="checkScore()">Check Score</button>
  <div class="result" id="output"></div>

  <script>
    async function checkScore() {
      const inputText = document.getElementById('inputText').value;
      const contextType = document.getElementById('contextType').value;
      const modelType = document.getElementById('modelType').value;
      const button = document.getElementById('submitBtn');
      const output = document.getElementById('output');

      if (!inputText.trim()) return;

      button.disabled = true;
      button.innerText = 'Evaluating...';
      output.innerHTML = '';

      try {
        const res = await fetch('/evaluate-bias', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: inputText, contextType, model: modelType })
        });

        const data = await res.json();
        output.innerHTML = '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
      } catch (err) {
        output.innerHTML = '<p style="color: red;">Failed to evaluate bias. Check console.</p>';
      }

      button.disabled = false;
      button.innerText = 'Check Score';
    }
  </script>
  <!-- Footer -->
  <footer style="margin-top: 40px; padding-top: 20px; border-top: 1px solid #ddd; font-size: 14px; color: #555;">
    <p>
      📂 <a href="https://github.com/minhajkk/bias_scoring_utility/" target="_blank" style="color: #007acc;">View on GitHub</a><br>
      🤖 Made with <strong>ChatGPT</strong>
    </p>
  </footer>
</body>
</html>
